---
name: unit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        # Every released Ruby allowed by required_ruby_version in the gemspec.
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
    runs-on: ${{ matrix.os }}
    env:
      RUBYOPT: '--disable-error_highlight'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ruby-setup
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec

  integration-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        # Deliberately narrower than the unit matrix: these provision a real
        # WinRM listener and carry a 10 hour timeout, so they cover the oldest
        # and newest supported Ruby rather than every version.
        ruby: ['3.1', '4.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 600

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Setup Machine
        run: |
          winrm.cmd quickconfig -q
          winrm.cmd set winrm/config/service/auth '@{Basic="true"}'
          winrm.cmd set winrm/config/service '@{AllowUnencrypted="true"}'
          net user /add vagrant Pass@word1
          net localgroup administrators vagrant /add
          @"
          endpoint: "http://localhost:5985/wsman"
          user: vagrant
          password: Pass@word1
          "@ | Out-File -FilePath tests/integration/config.yml -Encoding utf8

      - name: Run Integration Tests
        run: bundle exec rake integration
